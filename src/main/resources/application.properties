spring.application.name=ems

spring.security.user.name=user
spring.security.user.password=pass

spring.datasource.url=jdbc:mysql://localhost:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties (optional but commonly used)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.servlet.session.cookie.same-site=strict
#logging.level.root=WARN
#logging.level.org.springframework.web=DEBUG
#logging.level.com.yourpackage.yourservice=TRACE